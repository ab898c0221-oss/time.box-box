<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BOX BOX Settings</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>
<button onclick="location.href='settings.html'">

⚙️ Settings

</button>
<h1>⚙️ Settings</h1>

<p>Work Configuration</p>

</header>



<div class="card">


<h2>🕒 工作時間</h2>


<label>
上班時間
</label>

<input id="workStart" type="time">



<label>
放飯時間
</label>

<input id="lunchStart" type="time">



<label>
Lunch 長度（分鐘）
</label>

<input id="lunchDuration" type="number">



<label>
放工時間
</label>

<input id="workEnd" type="time">


<br><br>


<button id="saveBtn">

💾 Save Settings

</button>

<script>

const workStart =
document.getElementById("workStart");

const lunchStart =
document.getElementById("lunchStart");

const lunchDuration =
document.getElementById("lunchDuration");

const workEnd =
document.getElementById("workEnd");


// 讀取設定

workStart.value =
localStorage.getItem("workStart") || "11:00";


lunchStart.value =
localStorage.getItem("lunchStart") || "13:00";


lunchDuration.value =
localStorage.getItem("lunchDuration") || "60";


workEnd.value =
localStorage.getItem("workEnd") || "20:00";




// 保存

document
.getElementById("saveBtn")
.onclick=function(){


localStorage.setItem(
"workStart",
workStart.value
);


localStorage.setItem(
"lunchStart",
lunchStart.value
);


localStorage.setItem(
"lunchDuration",
lunchDuration.value
);


localStorage.setItem(
"workEnd",
workEnd.value
);


alert("⚙️ Settings Saved!");

};

</script>

</div>



<div class="card">

<h2>🏎️ Navigation</h2>


<button onclick="location.href='index.html'">

🏁 返回 Dashboard

</button>


</div>



</div>


</body>


</html>
