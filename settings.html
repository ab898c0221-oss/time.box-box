<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<title>BOX BOX Settings</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

<h1>⚙️ Settings</h1>

<p>Work Configuration</p>

</header>



<div class="card">


<h2>🕒 工作時間</h2>


<label>
上班時間
</label>

<input id="workStart" type="time">



<label>
放飯時間
</label>

<input id="lunchStart" type="time">



<label>
Lunch 長度（分鐘）
</label>

<input id="lunchDuration" type="number">



<label>
放工時間
</label>

<input id="workEnd" type="time">


<br><br>


<button id="saveBtn">

💾 Save Settings

</button>



</div>



<div class="card">

<h2>🏎️ Navigation</h2>


<button onclick="location.href='index.html'">

🏁 返回 Dashboard

</button>


</div>



</div>

</html>
